[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[project]
name = "rwt-gematria"
version = "1.0"
description = "Contains code helpful for exploring english qabalah (gematria)."
authors = [{ name = "Richard Todd" }]
requires-python = ">=3.13"
license = { text = "MIT" }
readme = "README.md"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Repository = "https://github.com/rwtodd/small_python_packages.git"

[tool.uv.build-backend]
module-root = "src"
module-name = "rwt_gematria"